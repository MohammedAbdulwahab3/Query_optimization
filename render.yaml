# Render Blueprint — one-click deploy.
#
# How to use:
#   1. Push this repo to GitHub (done).
#   2. Go to https://dashboard.render.com  ->  New  ->  Blueprint.
#   3. Connect this repository and click Apply.
#   4. Wait for the build, then open the generated *.onrender.com URL on your phone.
#
# Uses the embedded ClickHouse engine (chdb), so it runs as a SINGLE web
# service with no separate database to provision. Sample data is generated on
# startup. The free plan sleeps after inactivity, so the first request after a
# while takes ~30-60s to cold-start and reseed.
services:
  - type: web
    name: clickhouse-analytics
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: CH_BACKEND
        value: embedded
      - key: CHDB_PATH
        value: /tmp/chdb
      - key: AUTO_SEED
        value: "true"
      # Tuned for the free tier's 512 MB RAM (~330k events, seeds in ~1s).
      - key: SEED_SESSIONS
        value: "150000"
      - key: SEED_USERS
        value: "20000"
      - key: SEED_PRODUCTS
        value: "400"
      - key: SEED_DAYS
        value: "90"
