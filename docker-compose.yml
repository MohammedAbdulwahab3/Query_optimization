# Production-style deployment: a real clickhouse-server plus the FastAPI app
# (which also serves the dashboard). Bring it all up with:
#
#     docker compose up --build
#
# then open http://localhost:8000
services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: ch-analytics-db
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - ch-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "8123:8123"   # HTTP interface (handy for ad-hoc queries)

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ch-analytics-api
    environment:
      CH_BACKEND: server
      CH_HOST: clickhouse
      CH_PORT: "8123"
      CH_USER: default
      CH_PASSWORD: ""
      CH_DATABASE: analytics
      AUTO_SEED: "true"
      # ~1.1M events generated server-side on first startup.
      SEED_SESSIONS: "1000000"
      SEED_USERS: "80000"
      SEED_PRODUCTS: "800"
      SEED_DAYS: "90"
    depends_on:
      clickhouse:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  ch-data:
